<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora PSeInt con Validación</title>
</head>
<body>
  <h2>Calculadora con Validación (Estilo PSeInt en JS)</h2>

  <script>
    let num1, operacion, num2;
    let entradaValida = false;

    // 1. Bucle para validar el primer número (Operando 1)
    while (!entradaValida) {
      let input1 = prompt("Ingrese el primer número:");
      // Comprobamos si se canceló o si al convertir a número no es NaN
      if (input1 !== null && input1.trim() !== "" && !isNaN(Number(input1))) {
        num1 = Number(input1);
        entradaValida = true;
      } else {
        alert("Error: Debe ingresar un número válido.");
      }
    }

    // 2. Bucle para validar el operador (+, -, *, /, **)
    entradaValida = false;
    while (!entradaValida) {
      operacion = prompt("Ingrese el operador (+, -, *, /, **):");
      if (operacion === "+" || operacion === "-" || operacion === "*" || operacion === "/" || operacion === "**") {
        entradaValida = true;
      } else {
        alert("Error: Operación no válida. Use +, -, *, / o **.");
      }
    }

    // 3. Bucle para validar el segundo número (Operando 2)
    entradaValida = false;
    while (!entradaValida) {
      let input2 = prompt("Ingrese el segundo número:");
      if (input2 !== null && input2.trim() !== "" && !isNaN(Number(input2))) {
        num2 = Number(input2);
        // Validación adicional para evitar la división entre cero si el operador es '/'
        if (operacion === "/" && num2 === 0) {
          alert("Error: No se puede dividir entre cero. Ingrese otro número.");
        } else {
          entradaValida = true;
        }
      } else {
        alert("Error: Debe ingresar un número válido.");
      }
    }

    // 4. Estructura de decisiones encadenadas para calcular el resultado
    let resultado;
    let mensajeOperacion = "";

    if (operacion === "+") {
      mensajeOperacion = "Suma";
      resultado = num1 + num2;
    } else if (operacion === "-") {
      mensajeOperacion = "Resta";
      resultado = num1 - num2;
    } else if (operacion === "*") {
      mensajeOperacion = "Multiplicación";
      resultado = num1 * num2;
    } else if (operacion === "/") {
      mensajeOperacion = "División";
      resultado = num1 / num2;
    } else if (operacion === "**") {
      mensajeOperacion = "Potencia";
      resultado = num1 ** num2;
    }

    // 5. Salida de datos en pantalla
    alert("Operación: " + mensajeOperacion + "\nEl resultado es: " + resultado);
    document.write("<p><strong>Operación:</strong> " + mensajeOperacion + "</p>");
    document.write("<p><strong>Resultado final:</strong> " + num1 + " " + operacion + " " + num2 + " = " + resultado + "</p>");
  </script>
</body>
</html>
